<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Amiral Battı</title>
<style>
  :root{
    --bg:#07192B; --panel:#0E2C49; --panel2:#0B3C5D; --muted:#9FB3C8; --line:#1d496e;
    --btn:#7C4DFF; --btn2:#2b2e6b; --water:#0d3350; --waterAlt:#0f3858; --ship:#B0BEC5; --shipHit:#7F1D1D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:18px}
  h1{font-size:26px;margin:10px 0 2px;text-align:center}
  .sub{color:var(--muted);text-align:center;font-size:13px;margin-bottom:14px}
  .card{background:var(--panel);border-radius:14px;padding:14px;margin:10px 0}
  label{display:block;color:var(--muted);font-size:13px;margin:8px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a2238;color:#fff;font-size:16px}
  input.code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:24px;font-family:monospace}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-size:16px;font-weight:600;margin-top:10px;cursor:pointer}
  button.sec{background:var(--btn2)}
  button.ghost{background:transparent;color:var(--muted);font-weight:400}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px}
  .row>button{margin-top:0}
  .hidden{display:none !important}
  .err{color:#ff6b6b;text-align:center;margin:8px 0}
  .code-big{font-family:monospace;font-size:44px;letter-spacing:8px;text-align:center;margin:6px 0}
  .players{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:6px 10px;border-radius:8px;font-size:13px}
  .dot{width:14px;height:14px;border-radius:4px;display:inline-block}
  .banner{border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin:8px 0}
  .banner .name{font-size:20px;font-weight:700}
  .timer{font-size:30px;font-weight:700}
  #board,#overBoard{display:grid;gap:2px;width:100%;max-width:460px;margin:8px auto;aspect-ratio:1/1}
  .cell{background:var(--water);border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:3.4vw;user-select:none;overflow:hidden;min-width:0;min-height:0;transition:background .2s}
  .cell.alt{background:var(--waterAlt)}
  /* kendi gemin: parlak çelik + iç çerçeve + hafif gölge → belirgin */
  .cell.ship{background:#cfdae8;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65), 0 0 6px rgba(180,210,255,.35)}
  .cell.hit{background:#b23232}      /* düşman gemisi vuruldu (daha parlak kırmızı) */
  .cell.ownhit{background:var(--shipHit)}
  .cell.faded{background:#071726}    /* ıska → sönmüş su, geri plana düşer */
  .cell .miss{width:16%;height:16%;border-radius:50%;background:rgba(200,220,240,.16)}
  @media(min-width:520px){.cell{font-size:18px}}
  .pstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .pbox{min-width:64px;text-align:center;background:var(--panel2);border-radius:8px;padding:6px;font-size:12px}
  .pbox.turn{outline:2px solid #fff}
  .log{font-size:12px;color:#c8d6e5}
  .flash{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#b71c1c;border-radius:14px;padding:14px 22px;text-align:center;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .flash b{font-size:20px}
  .slider{width:100%}
  #overBoard{max-width:380px}
  .footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center;padding:4px 2px 24px}
  .footer a{color:var(--muted);font-size:13px;text-decoration:none}
  .footer a:hover{text-decoration:underline}
  .footer .credit{color:#6b7a8d;font-size:12px}
  .radio .rtop{display:flex;align-items:center;gap:10px}
  .rnow{color:var(--muted);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtoggle{width:auto;padding:8px 16px;margin:0;background:var(--btn2);font-size:18px}
  .rchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .rchip{width:auto;margin:0;padding:8px 12px;background:#0a2238;border:1px solid var(--line);font-size:13px;font-weight:500}
  .rchip.on{background:var(--btn);border-color:var(--btn)}
  .rmsg{color:#ff9b9b;font-size:12px;margin-top:6px}
  /* --- efektler --- */
  .cell[data-fire]{cursor:pointer}
  .cell[data-fire]:active{transform:scale(.88)}
  .cell.fxhit{animation:fxhit .55s ease-out}
  .cell.fxmiss{animation:fxmiss .5s ease-out}
  @keyframes fxhit{0%{transform:scale(1.5);filter:brightness(2.4);box-shadow:0 0 16px 7px rgba(255,120,40,.95)}100%{transform:scale(1);filter:none;box-shadow:none}}
  @keyframes fxmiss{0%{transform:scale(1.35);box-shadow:0 0 12px 5px rgba(150,200,255,.75)}100%{transform:scale(1);box-shadow:none}}
  .shake{animation:shake .4s ease-in-out}
  @keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(7px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  #board.glow{animation:glow 1.3s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--glow,#7C4DFF)}}
  .ultibar{background:linear-gradient(90deg,#b8860b,#ffcc33);color:#1a1200;font-weight:800;border-radius:12px;padding:12px 16px;margin:8px 0;text-align:center;animation:ultipulse 1s ease-in-out infinite}
  @keyframes ultipulse{0%,100%{box-shadow:0 0 0 0 rgba(255,204,51,0)}50%{box-shadow:0 0 0 6px rgba(255,204,51,.5)}}
  .flash.anim{animation:flashin .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes flashin{0%{transform:translateX(-50%) scale(.5) rotate(-4deg);opacity:0}70%{transform:translateX(-50%) scale(1.12) rotate(2deg)}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>⚓ Amiral Battı</h1>
  <div id="err" class="err hidden"></div>

  <!-- HOME -->
  <div id="home" class="card">
    <label>Adın</label>
    <input id="name" maxlength="14" placeholder="Adın" />
    <button id="btnCreate">Oda Kur (kod üret)</button>
    <label>veya bir odaya katıl</label>
    <input id="joinCode" class="code" maxlength="4" placeholder="KOD" />
    <button id="btnJoin" class="sec">Koda Katıl</button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="card hidden">
    <div style="text-align:center;color:var(--muted)">Oda Kodu</div>
    <div id="lobbyCode" class="code-big"></div>
    <button id="btnCopy" class="sec">Kodu kopyala</button>
    <div id="lobbyHint" class="sub"></div>
    <div class="card" style="background:var(--panel2)">
      <div id="lobbyPlayers" class="players"></div>
    </div>
    <div id="hostSettings" class="hidden">
      <label>Her oyuncunun gemi sayısı: <span id="shipsVal">4</span></label>
      <input id="shipsSlider" class="slider" type="range" min="2" max="6" value="4" />
      <label>El süresi: <span id="turnVal">25</span> sn</label>
      <input id="turnSlider" class="slider" type="range" min="10" max="60" step="5" value="25" />
      <button id="btnStart">Başlat</button>
    </div>
    <button class="ghost" onclick="leave()">← Menü</button>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div id="placingBox" class="card hidden">
      <div style="font-weight:600">Gemilerin yerleştirildi</div>
      <div class="sub">Haritada kendi gemilerini gör, onayla</div>
      <button id="btnReady">Onayla ve Hazırım</button>
    </div>
    <div id="ultiBar" class="ultibar hidden"></div>
    <div id="turnBanner" class="banner hidden">
      <div style="display:flex;align-items:center;gap:10px">
        <span id="turnDot" class="dot" style="width:22px;height:22px"></span>
        <span id="turnName" class="name"></span>
      </div>
      <span id="turnTimer" class="timer"></span>
    </div>
    <div id="board"></div>
    <div id="pstrip" class="pstrip"></div>
    <div class="card"><div id="log" class="log"></div></div>
    <button class="ghost" onclick="leave()">← Çık</button>
  </div>

  <!-- OVER -->
  <div id="over" class="card hidden reveal">
    <div style="text-align:center;font-size:48px">🏆</div>
    <div id="winner" style="text-align:center;font-size:22px;font-weight:700"></div>
    <div class="card" style="background:var(--panel2)">
      <div style="font-weight:600;margin-bottom:6px">Skorlar</div>
      <div id="scores"></div>
    </div>
    <div style="text-align:center;color:var(--muted);margin:6px 0">Gemiler neredeydi</div>
    <div id="overBoard"></div>
    <div id="overLegend" class="players" style="justify-content:center;margin-top:8px"></div>
    <button id="btnRematch" class="hidden" onclick="send({t:'rematch'})">🔄 Tekrar oyna (aynı oda)</button>
    <div id="rematchHint" class="sub hidden">Tekrar oynamak için host "Tekrar oyna"ya bassın</div>
    <button class="sec" onclick="leave()">Ana menüye dön</button>
  </div>
  <div class="radio card">
    <div class="rtop">
      <span>📻 Radyo</span>
      <span id="radioNow" class="rnow">—</span>
      <button id="radioToggle" class="rtoggle" onclick="toggleRadio()">▶</button>
    </div>
    <div id="radioChips" class="rchips"></div>
    <div id="radioMsg" class="rmsg"></div>
  </div>

  <div class="footer">
    <a href="https://github.com/LyraN66/BattleShip" target="_blank" rel="noopener">Kaynak kod · GitHub</a>
    <span class="credit">designed by Buğra</span>
  </div>
</div>

<div id="flash" class="flash hidden"></div>

<script>
const COLORS=["#E53935","#1E88E5","#43A047","#FDD835","#8E24AA","#FB8C00","#00ACC1","#D81B60"];
const colorOf=i=>COLORS[((i%8)+8)%8];
const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hidden',!on);

let ws=null, st={}, myId=-1, isHost=false, phase="", roomCode=null;
let myShips=[], players=[], shots=[], w=10, h=10, turn=-1, deadline=0, log=[], reveal=null, winner=-1;
let lastSunkSeq=0, readySent=false, timerIv=null;
let prevShotKeys=new Set(), pendingFx=[], prevPhase="";
let ultiPlayer=-1, ultiLeft=0, ultiBy="", lastUltiSeq=0;
let sessionToken=null, leaving=false, reconnecting=false, reconnectTries=0, reconnTimer=null;

$('name').value = localStorage.getItem('name')||"";
$('name').oninput = ()=>localStorage.setItem('name',$('name').value);
$('joinCode').oninput = ()=>{ $('joinCode').value = $('joinCode').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4); };

function wsUrl(){ return (location.protocol==='https:'?'wss://':'ws://')+location.host; }
function openSocket(hello){
  ws = new WebSocket(wsUrl());
  ws.onopen = ()=>{ try{ws.send(JSON.stringify(hello));}catch(e){} };
  ws.onmessage = e=>onMsg(JSON.parse(e.data));
  ws.onclose = ()=>{
    if(leaving) return;
    if(sessionToken && roomCode){
      // uygulama değiştirme/ağ kopması: aynı oturuma otomatik geri bağlan
      if(reconnectTries<12){ reconnecting=true; reconnectTries++; showReconnecting(); clearTimeout(reconnTimer); reconnTimer=setTimeout(()=>openSocket({t:'resume',code:roomCode,token:sessionToken}), Math.min(2500, 400*reconnectTries)); }
      else { reconnecting=false; showErr('Yeniden bağlanılamadı. Sayfayı yenileyin.'); }
    } else if(phase!=='OVER'){ showErr('Bağlantı kesildi'); }
  };
  ws.onerror = ()=>{};
}
function connect(hello){ leaving=false; reconnecting=false; reconnectTries=0; sessionToken=null; showErr(''); openSocket(hello); }
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function showErr(m){ const e=$('err'); e.textContent=m?('❌ '+m):''; e.style.color=''; e.classList.toggle('hidden',!m); }
function showReconnecting(){ const e=$('err'); e.textContent='🔄 Yeniden bağlanılıyor…'; e.style.color='#ffd27a'; e.classList.remove('hidden'); }
// Uygulamaya geri dönünce / ağ gelince hemen dene
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') maybeReconnect(); });
window.addEventListener('online', maybeReconnect);
window.addEventListener('focus', maybeReconnect);
function maybeReconnect(){
  if(leaving || !sessionToken || !roomCode) return;
  if(ws && ws.readyState===1) return;        // zaten bağlı
  if(ws && ws.readyState===0) return;         // bağlanıyor
  clearTimeout(reconnTimer); reconnTimer=null;
  reconnectTries=0; reconnecting=true; showReconnecting();
  openSocket({t:'resume',code:roomCode,token:sessionToken});
}

$('btnCreate').onclick=()=>{ const n=$('name').value.trim(); if(!n)return showErr('Önce adını yaz'); connect({t:'create',name:n}); };
$('btnJoin').onclick=()=>{ const n=$('name').value.trim(); const c=$('joinCode').value.trim(); if(!n)return showErr('Önce adını yaz'); if(c.length<4)return showErr('4 haneli kodu gir'); connect({t:'join',code:c,name:n}); };
$('btnCopy').onclick=()=>{ if(roomCode) navigator.clipboard&&navigator.clipboard.writeText(roomCode); $('btnCopy').textContent='✓ Kopyalandı'; };
$('btnStart').onclick=()=>send({t:'start'});
$('btnReady').onclick=()=>{ send({t:'ready'}); $('btnReady').disabled=true; $('btnReady').textContent='Onaylandı, bekleniyor…'; };
$('shipsSlider').oninput=()=>{ $('shipsVal').textContent=$('shipsSlider').value; send({t:'config',ships:+$('shipsSlider').value,turnSec:+$('turnSlider').value}); };
$('turnSlider').oninput=()=>{ $('turnVal').textContent=$('turnSlider').value; send({t:'config',ships:+$('shipsSlider').value,turnSec:+$('turnSlider').value}); };

function leave(){ leaving=true; reconnecting=false; sessionToken=null; clearTimeout(reconnTimer); try{ws&&ws.close();}catch(e){} ws=null; phase=""; myId=-1; isHost=false; roomCode=null; myShips=[]; reveal=null; readySent=false; lastSunkSeq=0; prevShotKeys=new Set(); pendingFx=[]; prevPhase=""; ultiPlayer=-1; ultiLeft=0; lastUltiSeq=0; if(timerIv){clearInterval(timerIv);timerIv=null;} render(); }

function onMsg(m){
  if(m.t==='created'){ roomCode=m.code; myId=m.id; isHost=!!m.host; if(m.token) sessionToken=m.token; reconnecting=false; reconnectTries=0; clearTimeout(reconnTimer); showErr(''); }
  else if(m.t==='welcome'){ myId=m.id; isHost=!!m.host; if(m.token) sessionToken=m.token; reconnecting=false; reconnectTries=0; clearTimeout(reconnTimer); showErr(''); }
  else if(m.t==='error'){ if(reconnecting){ reconnecting=false; sessionToken=null; try{ws&&ws.close();}catch(e){} ws=null; } showErr(m.msg); }
  else if(m.t==='yourships'){ w=m.w; h=m.h; myShips=m.ships||[]; }
  else if(m.t==='state'){
    phase=m.phase; w=m.w; h=m.h; turn=m.turn; deadline=m.deadline; winner=m.winner;
    players=m.players||[]; shots=m.shots||[]; log=m.log||[]; if(m.code) roomCode=m.code;
    reveal=m.reveal||reveal;
    // efektler: yeni atışları bul
    const newFx=[]; (shots||[]).forEach(s=>{ if(!prevShotKeys.has(s.x+','+s.y)) newFx.push(s); });
    prevShotKeys=new Set((shots||[]).map(s=>s.x+','+s.y));
    pendingFx=newFx;
    if(newFx.some(s=>s.hit)){ screenShake(); vibrate([0,55]); }
    if(m.sunkSeq>lastSunkSeq){ lastSunkSeq=m.sunkSeq; doFlash(m.sunkBy,m.sunkOwner); vibrate([0,60,40,90]); }
    ultiPlayer=(m.ultiPlayer!==undefined?m.ultiPlayer:-1); ultiLeft=m.ultiLeft||0; ultiBy=m.ultiBy||"";
    if((m.ultiSeq||0)>lastUltiSeq){ lastUltiSeq=m.ultiSeq; doUltiFlash(ultiBy); vibrate([0,40,30,40,30,90]); }
    if(phase==='OVER' && prevPhase!=='OVER'){ confettiBurst(); vibrate([0,80,60,120]); }
    prevPhase=phase;
    if(phase!=='PLACING'){ readySent=false; }
    if(phase==='LOBBY'){ lastSunkSeq=0; lastUltiSeq=0; prevShotKeys=new Set(); reveal=null; myShips=[]; ultiPlayer=-1; ultiLeft=0; }
  }
  render();
}

function doFlash(by,owner){
  const f=$('flash');
  const sub = (by===owner||!owner) ? (by+' bir gemi batırdı') : (by+", "+owner+"'ın gemisini batırdı");
  f.innerHTML='<b>💥 İçinden geçti!</b><br><span style="color:#ffd7d7">'+sub+'</span>';
  f.classList.remove('hidden');
  f.classList.remove('anim'); void f.offsetWidth; f.classList.add('anim');
  clearTimeout(f._t); f._t=setTimeout(()=>f.classList.add('hidden'),2000);
}

function myName(){ const p=players.find(p=>p.id===myId); return p?p.name:''; }
function doUltiFlash(by){
  const mine = by && by===myName();
  const f=$('flash');
  f.style.background='linear-gradient(90deg,#b8860b,#ffcc33)';
  f.innerHTML='<b style="color:#1a1200">⚡ ULTI!</b><br><span style="color:#2a1f00">'+(mine?'ULTI kazandın! 4 kare seç':esc(by)+' ULTI kazandı')+'</span>';
  f.classList.remove('hidden'); f.classList.remove('anim'); void f.offsetWidth; f.classList.add('anim');
  clearTimeout(f._t); f._t=setTimeout(()=>{ f.classList.add('hidden'); f.style.background=''; },2200);
}
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function screenShake(){ const w=document.querySelector('.wrap'); if(!w)return; w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); setTimeout(()=>w.classList.remove('shake'),430); }
function applyFx(){ if(!pendingFx.length) return; const b=$('board'); if(b) pendingFx.forEach(s=>{ const el=b.querySelector('[data-x="'+s.x+'"][data-y="'+s.y+'"]'); if(el) el.classList.add(s.hit?'fxhit':'fxmiss'); }); pendingFx=[]; }
function confettiBurst(){
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60';
  document.body.appendChild(c);
  const ctx=c.getContext('2d'); const W=c.width=innerWidth, H=c.height=innerHeight;
  const P=[];
  for(let i=0;i<130;i++) P.push({x:Math.random()*W,y:-20-Math.random()*H*0.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,s:5+Math.random()*7,col:COLORS[i%COLORS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.35});
  const t0=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.035; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore(); });
    if(t-t0<3000) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

const myColor=()=>{ const p=players.find(p=>p.id===myId); return p?colorOf(p.color):'#888'; };
const myTurn=()=>phase==='PLAYING'&&turn===myId;

function render(){
  const inRoom = !!ws;
  show('home', !inRoom);
  show('lobby', inRoom && (phase===''||phase==='LOBBY'));
  show('game', inRoom && (phase==='PLACING'||phase==='PLAYING'));
  show('over', inRoom && phase==='OVER');

  if(phase===''||phase==='LOBBY'){
    $('lobbyCode').textContent = roomCode||'…';
    show('hostSettings', isHost);
    $('lobbyHint').textContent = isHost ? "Arkadaşların bu kodla 'Koda Katıl' yapsın" : "Host'un başlatması bekleniyor…";
    $('btnStart').disabled = players.length<2;
    $('btnStart').textContent = players.length<2 ? 'En az 2 oyuncu gerekli' : 'Başlat';
    $('lobbyPlayers').innerHTML = players.map(p=>`<span class="pchip"><span class="dot" style="background:${colorOf(p.color)}"></span>${esc(p.name)}${p.id===myId?' (sen)':''}</span>`).join('');
  }

  if(phase==='PLACING'||phase==='PLAYING'){
    show('placingBox', phase==='PLACING');
    show('turnBanner', phase==='PLAYING');
    const ultiActive = phase==='PLAYING' && ultiPlayer>=0;
    const ub=$('ultiBar');
    if(ultiActive){
      if(ultiPlayer===myId) ub.textContent='⚡ ULTI! Kalan bomba: '+ultiLeft+' — bir kareye dokun, bomba yağsın';
      else { const up=players.find(p=>p.id===ultiPlayer); ub.textContent='⚡ '+(up?up.name:'Rakip')+' ULTI kullanıyor…'; }
      ub.classList.remove('hidden');
    } else ub.classList.add('hidden');
    if(phase==='PLAYING'){
      const cur=players.find(p=>p.id===turn);
      const col=cur?colorOf(cur.color):'#888';
      const b=$('turnBanner'); b.style.background = myTurn()?col:hexA(col,.22);
      $('turnDot').style.background=col;
      $('turnName').textContent = myTurn()?(ultiPlayer===myId?'⚡ ULTI SENDE':'🎯 SIRA SENDE'):('Sıra: '+(cur?cur.name:'-'));
    }
    drawBoard($('board'), true);
    const bd=$('board');
    if(phase==='PLAYING' && myTurn()){ bd.style.setProperty('--glow', myColor()); bd.classList.add('glow'); }
    else bd.classList.remove('glow');
    applyFx();
    $('pstrip').innerHTML = players.map(p=>{
      const t=p.id===turn&&phase==='PLAYING';
      return `<div class="pbox ${t?'turn':''}" style="${t?'background:'+hexA(colorOf(p.color),.3):''}">
        <span class="dot" style="background:${colorOf(p.color)}"></span><br>
        <span style="color:${p.alive?'#fff':'#6b7a8d'}">${esc(p.name)}</span><br>
        <span style="color:var(--muted)">${p.alive?(p.shipsLeft+' gemi'):'elendi'}</span></div>`;
    }).join('');
    $('log').innerHTML = log.slice(-5).map(l=>'• '+esc(l)).join('<br>');
    startTimer();
  } else { if(timerIv){clearInterval(timerIv);timerIv=null;} }

  if(phase==='OVER'){
    const wn=players.find(p=>p.id===winner);
    $('winner').textContent = wn?('Kazanan: '+wn.name):'Oyun bitti';
    const sorted=[...players].sort((a,b)=>(b.sunk*100+b.hits)-(a.sunk*100+a.hits));
    $('scores').innerHTML = sorted.map(p=>`<div style="display:flex;justify-content:space-between;margin:4px 0">
      <span><span class="dot" style="background:${colorOf(p.color)}"></span> ${esc(p.name)}</span>
      <span style="color:var(--muted)">${p.sunk} batırma · ${p.hits} isabet</span></div>`).join('');
    drawBoard($('overBoard'), false);
    $('overLegend').innerHTML = players.map(p=>`<span class="pchip"><span class="dot" style="background:${colorOf(p.color)}"></span>${esc(p.name)}</span>`).join('');
    show('btnRematch', isHost);
    show('rematchHint', !isHost);
  }
}

function startTimer(){
  if(timerIv) clearInterval(timerIv);
  timerIv=setInterval(()=>{
    if(phase!=='PLAYING'||!deadline){ $('turnTimer').textContent=''; return; }
    const r=Math.max(0,Math.round((deadline-Date.now())/1000));
    const el=$('turnTimer'); el.textContent=r; el.style.color = r<=5?'#ff5252':'#fff';
  },300);
}

function drawBoard(container, interactive){
  const myCells=new Set(myShips.flat().map(c=>c[0]+','+c[1]));
  const shotMap={}; shots.forEach(s=>shotMap[s.x+','+s.y]=s);
  const revMap={}; if(reveal) reveal.forEach(r=>r.cells.forEach(c=>revMap[c[0]+','+c[1]]=r.color));
  const colById={}; players.forEach(p=>colById[p.id]=colorOf(p.color));
  container.style.gridTemplateColumns=`repeat(${w},1fr)`;
  container.style.gridTemplateRows=`repeat(${h},1fr)`;
  let html='';
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const k=x+','+y, alt=(x+y)%2===1;
    const mine=myCells.has(k), shot=shotMap[k], rev=revMap[k];
    let cls='cell'+(alt?' alt':'');
    let style='', mark='';
    if(shot){
      if(shot.hit) cls += mine ? ' ownhit' : ' hit';
      else cls += ' faded';           // ıska → kararır, göz yormaz
    } else if(mine){
      cls += ' ship';                  // kendi gemin → parlak/belirgin
    }
    if(rev!==undefined && !(mine)) style=`background:${hexA(colorOf(rev),.6)}`;
    if(shot){
      if(shot.hit){ const sc=colById[shot.by]||'#fff'; mark=`<span style="color:${sc}">✕</span>`; }
      else { mark='<span class="miss"></span>'; }   // küçük, soluk nokta
    }
    const canFire = interactive && myTurn() && !shot;
    html+=`<div class="${cls}" style="${style}" data-x="${x}" data-y="${y}" ${canFire?'data-fire=1':''}>${mark}</div>`;
  }
  container.innerHTML=html;
  if(interactive){
    container.querySelectorAll('[data-fire]').forEach(el=>{
      el.onclick=()=>send({t:'fire',x:+el.dataset.x,y:+el.dataset.y});
    });
  }
}

function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// --- Radyo (https yayınlar; ses telefon tuşlarından) ---
const STATIONS=[
  {n:"PowerTürk", u:"https://listen.powerapp.com.tr/powerturk/mpeg/icecast.audio"},
  {n:"Kral Pop", u:"https://ssldyg.radyotvonline.com/smil/smil:kralpop.smil/playlist.m3u8"},
  {n:"Power Pop", u:"https://listen.powerapp.com.tr/powerpop/mpeg/icecast.audio"},
  {n:"Power FM", u:"https://listen.powerapp.com.tr/powerfm/mpeg/icecast.audio"},
  {n:"PowerTürk Slow", u:"https://listen.powerapp.com.tr/powerturkslow/mpeg/icecast.audio"},
  {n:"Power Love", u:"https://listen.powerapp.com.tr/powerlove/mpeg/icecast.audio"},
  {n:"Power Dance", u:"https://listen.powerapp.com.tr/powerdance/mpeg/icecast.audio"},
];
const radio=new Audio(); radio.preload='none';
let curStation=-1, radioPlaying=false, hls=null;
function radioStatus(m){ $('radioMsg').textContent=m||''; }
function renderRadio(){
  $('radioChips').innerHTML=STATIONS.map((s,i)=>`<button class="rchip ${i===curStation?'on':''}" onclick="pickStation(${i})">${esc(s.n)}</button>`).join('');
  $('radioToggle').textContent = radioPlaying?'⏸':'▶';
  $('radioNow').textContent = curStation>=0?STATIONS[curStation].n:'—';
}
function loadStation(url){
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  const isHls = url.indexOf('.m3u8')>=0;
  if(isHls && window.Hls && window.Hls.isSupported()){
    hls=new Hls(); hls.loadSource(url); hls.attachMedia(radio);
    return radio.play();
  }
  radio.src=url;   // Safari HLS'i yerel oynatır; diğer yayınlar da buradan
  return radio.play();
}
function pickStation(i){
  if(i===curStation){ toggleRadio(); return; }
  curStation=i; radioStatus('');
  loadStation(STATIONS[i].u).then(()=>{radioPlaying=true;renderRadio();}).catch(()=>{radioStatus('Çalınamadı, başka istasyon dene');});
  renderRadio();
}
function toggleRadio(){
  if(curStation<0){ pickStation(0); return; }
  if(radioPlaying){ radio.pause(); } else { radio.play().catch(()=>radioStatus('Çalınamadı, başka istasyon dene')); }
}
radio.onplaying=()=>{ radioPlaying=true; renderRadio(); };
radio.onpause=()=>{ radioPlaying=false; renderRadio(); };
radio.onerror=()=>{ radioPlaying=false; radioStatus('Çalınamadı, başka istasyon dene'); renderRadio(); };
renderRadio();

render();
</script>
