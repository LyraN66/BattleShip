name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Debug APK derle
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build-log.txt
      - name: Hata kaydını issue olarak yaz
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Son derleme başarısız. İlgili hata satırları:"
            echo '```'
            grep -nE "e: |error:|FAILED|Unresolved|cannot|AAPT|What went wrong|> Task" build-log.txt | head -n 120
            echo '--- son 60 satır ---'
            tail -n 60 build-log.txt
            echo '```'
          } > body.md
          gh issue create --title "build-error $(date -u +%H%M%S)" --body-file body.md
      - uses: actions/upload-artifact@v5
        with:
          name: BattleShip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yi Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AmiralBatti.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum AmiralBatti.apk --title "Amiral Battı (son sürüm)" --notes "Telefona kurmak için AmiralBatti.apk dosyasını indirin."
